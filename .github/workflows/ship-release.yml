name: Bootstrap stable release
# One-time v1.35.1 startup-rendering hotfix release.

on:
  push:
    branches:
      - release-bootstrap-v1.35.1
    paths:
      - .github/workflows/ship-release.yml

permissions:
  contents: write
  actions: write

jobs:
  create-release-and-dispatch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the release draft exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.35.1
          SOURCE_SHA: 11fc9062dcb5e813e245037b4d4437ca74941ec0
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$SOURCE_SHA" \
              --draft \
              --title "酷安 $TAG" \
              --notes "## 更新内容

          - 修复酷安 iOS 身份协议、设备指纹与请求头生成。
          - 修复 Windows 启动时的白屏闪烁与短暂黑屏：主窗口在启动页就绪后显示，设置持久化与原生同步不再阻塞首屏。
          - 保留启动最小化到托盘行为。
          - 已通过前端单元测试、类型检查、构建检查，以及 Windows、Linux、macOS Rust 检查。

          本次 Release 包含 Windows 安装版、Windows 单文件便携版及其他可用平台产物。" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Create the actual Git tag for the merged main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.35.1
          SOURCE_SHA: 11fc9062dcb5e813e245037b4d4437ca74941ec0
        shell: bash
        run: |
          set -euo pipefail
          REF="refs/tags/$TAG"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
            if [[ "$CURRENT_SHA" != "$SOURCE_SHA" ]]; then
              echo "Tag $TAG already points to $CURRENT_SHA, not expected source $SOURCE_SHA." >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="$REF" \
              -f sha="$SOURCE_SHA"
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha'

      - name: Dispatch the existing release build on the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.35.1
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build.yml --ref "$TAG" --repo "$GITHUB_REPOSITORY"
          echo "Dispatched build.yml for $TAG."
