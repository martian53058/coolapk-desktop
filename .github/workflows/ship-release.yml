name: Bootstrap stable release

on:
  push:
    branches:
      - release-bootstrap-v1.35.0
    paths:
      - .github/workflows/ship-release.yml

permissions:
  contents: write
  actions: write

jobs:
  create-release-and-dispatch-build:
    runs-on: ubuntu-latest
    steps:
      - name: Create the stable release tag from the merged main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.35.0
          SOURCE_SHA: f87e786bf1b4898a75537c5d26e917e87ca2ecdd
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --target "$SOURCE_SHA" \
            --draft \
            --title "酷安 $TAG" \
            --notes "## 更新内容

          - 修复酷安 iOS 身份协议、设备指纹与请求头生成。
          - 修正 Token 与设备头字段解析测试。
          - 已通过前端测试、类型检查，以及 Windows、Linux、macOS Rust 检查。

          本次 Release 将由 GitHub Actions 构建 Windows 安装版、Windows 便携版及其他可用平台产物。" \
            --repo "$GITHUB_REPOSITORY"

      - name: Dispatch the existing release build on the new tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.35.0
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build.yml --ref "$TAG" --repo "$GITHUB_REPOSITORY"
          echo "Dispatched build.yml for $TAG."
