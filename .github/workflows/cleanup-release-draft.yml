name: Cleanup stale release draft

on:
  push:
    branches:
      - release-bootstrap-v1.35.0
    paths:
      - .github/workflows/cleanup-release-draft.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Windows assets, then remove the empty bootstrap draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.35.1
          STALE_DRAFT_ID: "420398565"
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' 2>/dev/null || true)"
            if printf '%s\n' "$assets" | grep -Eq 'x64-setup\.exe$' &&
               printf '%s\n' "$assets" | grep -Eq 'x64-portable\.exe$'; then
              echo "Windows installer and portable EXE are attached."
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$STALE_DRAFT_ID"
              echo "Removed the empty temporary draft release."
              exit 0
            fi
            echo "Waiting for Windows installer and portable EXE (attempt $attempt/80)..."
            sleep 30
          done
          echo "Timed out waiting for Windows assets; leaving the draft untouched." >&2
          exit 1
